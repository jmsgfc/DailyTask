[package]
name = "dailytask"
version = "0.1.0"
description = "Daily task check-in and todo desktop app"
authors = ["DailyTask"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a bin/lib name clash on Windows.
name = "dailytask_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
